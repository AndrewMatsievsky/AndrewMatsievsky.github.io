<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f2e28" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Кишеня" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="stylesheet" href="styles.css" />
    <title>Кишеня</title>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <button type="button" class="privacy-btn" id="privacy-btn" aria-pressed="false" aria-label="Приховати суми">
      Приховати
    </button>
    <main class="app">
      <header class="brand">
        <p class="brand-name">Кишеня</p>
        <p class="month-line" id="month-line"></p>
        <p class="install-hint" id="install-hint" hidden></p>
      </header>

      <section class="jar" aria-live="polite">
        <p class="jar-amount privacy-num" id="jar-amount">$0</p>
        <p class="jar-month-total privacy-num" id="jar-month-total"></p>
        <div class="jar-row">
          <p class="day-end-line" id="day-end-line"></p>
          <div class="jar-stage" id="jar-stage" role="button" tabindex="0" aria-label="Хвилі в банці">
            <div class="drops" id="drops"></div>
            <div class="jar-glass">
              <div class="jar-rim" aria-hidden="true"></div>
              <div class="jar-neck" aria-hidden="true"></div>
              <div class="jar-body">
                <div class="jar-fill" id="jar-fill">
                  <span class="jar-wave" aria-hidden="true"></span>
                  <span class="jar-wave jar-wave-2" aria-hidden="true"></span>
                </div>
                <div class="jar-shine" aria-hidden="true"></div>
              </div>
            </div>
          </div>
          <p class="earned-so-far" id="earned-so-far"></p>
        </div>
        <p class="today-line privacy-num" id="today-line">За сьогодні: $0</p>
        <p class="next-line" id="next-line">Додайте джерело доходу</p>
      </section>

      <section class="sources" aria-labelledby="sources-heading">
        <div class="section-head">
          <h2 id="sources-heading">Джерела</h2>
          <button type="button" class="btn-text" id="toggle-form">Додати</button>
        </div>

        <form class="source-form" id="source-form" hidden>
          <label>
            Назва
            <input
              type="text"
              name="name"
              id="source-name"
              placeholder="Зарплата"
              required
              autocomplete="off"
            />
          </label>
          <div class="form-row">
            <label>
              Сума
              <input
                type="number"
                name="amount"
                id="source-amount"
                placeholder="1200"
                min="0"
                step="0.01"
                required
                inputmode="decimal"
              />
            </label>
            <label>
              День
              <input
                type="number"
                name="day"
                id="source-day"
                placeholder="15"
                min="1"
                max="31"
                required
                inputmode="numeric"
              />
            </label>
          </div>
          <input type="hidden" id="source-id" value="" />
          <div class="form-actions">
            <button type="button" class="btn-ghost" id="cancel-form">Скасувати</button>
            <button type="submit" class="btn-primary" id="save-source">Зберегти</button>
          </div>
        </form>

        <ul class="source-list" id="source-list"></ul>
        <p class="empty" id="empty-state">Ще немає джерел. Натисніть «Додати».</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
