<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f2e28" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coin Pocket" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="stylesheet" href="styles.css" />
    <title>Coin Pocket</title>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="app">
      <header class="brand">
        <p class="brand-name">Coin Pocket</p>
        <p class="install-hint" id="install-hint" hidden></p>
      </header>

      <section class="jar" aria-live="polite">
        <p class="jar-label">In the jar this month</p>
        <p class="jar-amount" id="jar-amount">$0</p>
        <div class="jar-visual" aria-hidden="true">
          <div class="jar-glass">
            <div class="jar-fill" id="jar-fill"></div>
          </div>
        </div>
        <p class="next-line" id="next-line">Add a money source to begin</p>
      </section>

      <section class="sources" aria-labelledby="sources-heading">
        <div class="section-head">
          <h2 id="sources-heading">Sources</h2>
          <button type="button" class="btn-text" id="toggle-form">Add</button>
        </div>

        <form class="source-form" id="source-form" hidden>
          <label>
            Name
            <input
              type="text"
              name="name"
              id="source-name"
              placeholder="Salary"
              required
              autocomplete="off"
            />
          </label>
          <div class="form-row">
            <label>
              Amount
              <input
                type="number"
                name="amount"
                id="source-amount"
                placeholder="1200"
                min="0"
                step="0.01"
                required
                inputmode="decimal"
              />
            </label>
            <label>
              Day
              <input
                type="number"
                name="day"
                id="source-day"
                placeholder="15"
                min="1"
                max="31"
                required
                inputmode="numeric"
              />
            </label>
          </div>
          <input type="hidden" id="source-id" value="" />
          <div class="form-actions">
            <button type="button" class="btn-ghost" id="cancel-form">Cancel</button>
            <button type="submit" class="btn-primary" id="save-source">Save</button>
          </div>
        </form>

        <ul class="source-list" id="source-list"></ul>
        <p class="empty" id="empty-state">No sources yet. Tap Add to create one.</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
