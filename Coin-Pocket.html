<title>Кишеня</title>
<style>
:root {
  --bg-deep: #0c2420;
  --bg-mid: #14352f;
  --leaf: #2f8f72;
  --leaf-bright: #4ec99a;
  --coin: #e8c56a;
  --coin-soft: #f3df9a;
  --ink: #f4f0e6;
  --ink-muted: rgba(244, 240, 230, 0.68);
  --line: rgba(244, 240, 230, 0.14);
  --danger: #e07a6a;
  --glass: rgba(255, 255, 255, 0.06);
  --radius: 18px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: "Avenir Next", "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--bg-deep);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100dvh;
  background: var(--bg-deep);
  -webkit-font-smoothing: antialiased;
}

.atmosphere {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(78, 201, 154, 0.22), transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 80%, rgba(232, 197, 106, 0.12), transparent 50%),
    radial-gradient(ellipse 50% 35% at 0% 60%, rgba(47, 143, 114, 0.18), transparent 45%),
    linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 55%);
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  max-width: 430px;
  margin: 0 auto;
  padding: calc(20px + var(--safe-top)) 20px calc(28px + var(--safe-bottom));
}

.brand {
  text-align: center;
}

.brand-name {
  margin: 0 0 8px;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: clamp(2.6rem, 10vw, 3.2rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--coin-soft);
  animation: rise 0.7s ease-out both;
}

.month-line {
  margin: 0 0 16px;
  font-size: 0.95rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.install-hint {
  margin: 0 auto 24px;
  max-width: 22rem;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(232, 197, 106, 0.35);
  background: rgba(232, 197, 106, 0.12);
  color: var(--coin-soft);
  font-size: 0.85rem;
  line-height: 1.35;
  text-align: left;
}

.install-hint[hidden] {
  display: none;
}

.install-hint.ok {
  border-color: rgba(78, 201, 154, 0.35);
  background: rgba(78, 201, 154, 0.12);
  color: var(--leaf-bright);
}

.jar {
  text-align: center;
  margin-bottom: 36px;
  animation: rise 0.8s 0.08s ease-out both;
}

.jar-label {
  margin: 0 0 6px;
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.jar-amount {
  margin: 0 0 18px;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: clamp(3rem, 14vw, 3.75rem);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--ink);
  transition: transform 0.35s ease;
}

.jar-amount.bump {
  transform: scale(1.04);
}

.jar-visual {
  display: flex;
  justify-content: center;
  margin-bottom: 16px;
}

.jar-stage {
  position: relative;
  width: 160px;
  height: 200px;
  margin: 0 auto 16px;
}

.drops {
  position: absolute;
  inset: 0 20px 50px;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}

.coin-drop {
  position: absolute;
  top: -12px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff6c8, var(--coin) 55%, #b8862d);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
  animation: pour linear forwards;
}

@keyframes pour {
  0% {
    transform: translateY(0) scale(0.7);
    opacity: 0;
  }
  12% {
    opacity: 1;
  }
  100% {
    transform: translateY(150px) scale(1);
    opacity: 0.15;
  }
}

.today-line {
  margin: 0 0 8px;
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--leaf-bright);
}

.jar-glass {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 110px;
  height: 140px;
  border: 2px solid rgba(244, 240, 230, 0.28);
  border-radius: 18px 18px 28px 28px;
  background: linear-gradient(
    180deg,
    rgba(255, 255, 255, 0.08),
    rgba(255, 255, 255, 0.02)
  );
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
}

.jar-glass::before {
  content: "";
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 48px;
  height: 10px;
  border-radius: 6px;
  background: rgba(244, 240, 230, 0.18);
}

.jar-fill {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0%;
  background: linear-gradient(180deg, var(--leaf-bright), var(--leaf));
  transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}

.jar-fill::after {
  content: "";
  position: absolute;
  top: -6px;
  left: -10%;
  width: 120%;
  height: 14px;
  border-radius: 50%;
  background: rgba(243, 223, 154, 0.35);
  animation: shimmer 3.2s ease-in-out infinite;
}

.next-line {
  margin: 0;
  font-size: 1rem;
  color: var(--ink-muted);
  min-height: 1.4em;
}

.next-line strong {
  color: var(--coin);
  font-weight: 600;
}

.sources {
  animation: rise 0.85s 0.16s ease-out both;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}

.section-head h2 {
  margin: 0;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 1.35rem;
  font-weight: 500;
}

.btn-text,
.btn-ghost,
.btn-primary,
.btn-icon {
  font: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

.btn-text {
  color: var(--leaf-bright);
  font-weight: 600;
  font-size: 0.95rem;
  padding: 6px 2px;
}

.source-form {
  display: grid;
  gap: 12px;
  margin-bottom: 18px;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--glass);
  border: 1px solid var(--line);
}

.source-form[hidden] {
  display: none;
}

.source-form label {
  display: grid;
  gap: 6px;
  font-size: 0.8rem;
  color: var(--ink-muted);
}

.source-form input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.25);
  color: var(--ink);
  font: inherit;
  font-size: 1rem;
}

.source-form input:focus {
  outline: 2px solid var(--leaf);
  outline-offset: 1px;
}

.form-row {
  display: grid;
  grid-template-columns: 1.4fr 0.8fr;
  gap: 10px;
}

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 4px;
}

.btn-ghost {
  padding: 10px 14px;
  color: var(--ink-muted);
}

.btn-primary {
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--coin);
  color: #1a2a22;
  font-weight: 600;
}

.btn-primary:active {
  transform: scale(0.98);
}

.source-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.source-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  align-items: center;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--glass);
  animation: rise 0.4s ease-out both;
}

.source-item.paid .source-name::after {
  content: " у кишені";
  color: var(--leaf-bright);
  font-weight: 500;
  font-size: 0.75rem;
}

.source-name {
  font-weight: 600;
  font-size: 1.05rem;
}

.source-meta {
  grid-column: 1;
  font-size: 0.85rem;
  color: var(--ink-muted);
}

.source-amount {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 1.2rem;
  font-weight: 500;
  color: var(--coin-soft);
}

.source-actions {
  display: flex;
  gap: 4px;
}

.btn-icon {
  width: auto;
  min-width: 36px;
  height: 36px;
  padding: 0 8px;
  border-radius: 10px;
  color: var(--ink-muted);
  font-size: 0.8rem;
  font-weight: 500;
}

.btn-icon:hover,
.btn-icon:focus-visible {
  background: rgba(255, 255, 255, 0.08);
  color: var(--ink);
}

.btn-icon.delete:hover,
.btn-icon.delete:focus-visible {
  color: var(--danger);
}

.empty {
  margin: 8px 0 0;
  color: var(--ink-muted);
  font-size: 0.95rem;
}

.empty[hidden] {
  display: none;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes shimmer {
  0%,
  100% {
    transform: translateX(-8%);
  }
  50% {
    transform: translateX(8%);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}

</style>
</head>
<body>
<div class="atmosphere" aria-hidden="true"></div>
<main class="app">
<header class="brand">
<p class="brand-name">Кишеня</p>
<p class="month-line" id="month-line"></p>
<p class="install-hint" id="install-hint" hidden></p>
</header>
<section class="jar" aria-live="polite">
<p class="jar-label">У кишені цього місяця</p>
<p class="jar-amount" id="jar-amount">$0</p>
<div class="jar-stage" aria-hidden="true">
<div class="drops" id="drops"></div>
<div class="jar-glass"><div class="jar-fill" id="jar-fill"></div></div>
</div>
<p class="today-line" id="today-line">За сьогодні: $0</p>
<p class="next-line" id="next-line">Додайте джерело доходу</p>
</section>
<section class="sources" aria-labelledby="sources-heading">
<div class="section-head">
<h2 id="sources-heading">Джерела</h2>
<button type="button" class="btn-text" id="toggle-form">Додати</button>
</div>
<form class="source-form" id="source-form" hidden>
<label>Назва<input type="text" name="name" id="source-name" placeholder="Зарплата" required autocomplete="off" /></label>
<div class="form-row">
<label>Сума<input type="number" name="amount" id="source-amount" placeholder="1200" min="0" step="0.01" required inputmode="decimal" /></label>
<label>День<input type="number" name="day" id="source-day" placeholder="15" min="1" max="31" required inputmode="numeric" /></label>
</div>
<input type="hidden" id="source-id" value="" />
<div class="form-actions">
<button type="button" class="btn-ghost" id="cancel-form">Скасувати</button>
<button type="submit" class="btn-primary" id="save-source">Зберегти</button>
</div>
</form>
<ul class="source-list" id="source-list"></ul>
<p class="empty" id="empty-state">Ще немає джерел. Натисніть «Додати».</p>
</section>
</main>
<script>
const STORAGE_KEY = "coin-pocket-sources-v1";

const MONTHS_UK = [
  "січень",
  "лютий",
  "березень",
  "квітень",
  "травень",
  "червень",
  "липень",
  "серпень",
  "вересень",
  "жовтень",
  "листопад",
  "грудень",
];

function uuid() {
  if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
    return crypto.randomUUID();
  }
  if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const hex = [...bytes].map((b) => b.toString(16).padStart(2, "0")).join("");
    return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
  }
  return `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
}

const els = {
  jarAmount: document.getElementById("jar-amount"),
  jarFill: document.getElementById("jar-fill"),
  nextLine: document.getElementById("next-line"),
  todayLine: document.getElementById("today-line"),
  monthLine: document.getElementById("month-line"),
  drops: document.getElementById("drops"),
  sourceList: document.getElementById("source-list"),
  emptyState: document.getElementById("empty-state"),
  form: document.getElementById("source-form"),
  toggleForm: document.getElementById("toggle-form"),
  cancelForm: document.getElementById("cancel-form"),
  name: document.getElementById("source-name"),
  amount: document.getElementById("source-amount"),
  day: document.getElementById("source-day"),
  id: document.getElementById("source-id"),
  save: document.getElementById("save-source"),
};

function loadSources() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    return parsed
      .filter((s) => s && typeof s.name === "string" && Number.isFinite(s.amount) && Number.isFinite(s.day))
      .map((s) => ({
        id: String(s.id || uuid()),
        name: s.name.trim(),
        amount: Number(s.amount),
        day: clampDay(Number(s.day)),
      }));
  } catch {
    return [];
  }
}

function saveSources(sources) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sources));
}

function clampDay(day) {
  return Math.min(31, Math.max(1, Math.round(day)));
}

function daysInMonth(year, monthIndex) {
  return new Date(year, monthIndex + 1, 0).getDate();
}

function workingDaysInMonth(year, monthIndex) {
  const total = daysInMonth(year, monthIndex);
  let count = 0;
  for (let day = 1; day <= total; day += 1) {
    const weekday = new Date(year, monthIndex, day).getDay();
    if (weekday !== 0 && weekday !== 6) count += 1;
  }
  return Math.max(1, count);
}

function effectivePayday(year, monthIndex, day) {
  return Math.min(clampDay(day), daysInMonth(year, monthIndex));
}

function startOfDay(date) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function money(n) {
  return new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: Math.abs(n % 1) < 1e-9 ? 0 : 2,
  }).format(n);
}

function daysWord(n) {
  const abs = Math.abs(n) % 100;
  const last = abs % 10;
  if (abs > 10 && abs < 20) return "днів";
  if (last === 1) return "день";
  if (last >= 2 && last <= 4) return "дні";
  return "днів";
}

function computeJar(sources, now = new Date()) {
  const today = now.getDate();
  const year = now.getFullYear();
  const month = now.getMonth();
  let total = 0;
  const paidIds = new Set();

  for (const source of sources) {
    const payday = effectivePayday(year, month, source.day);
    if (payday <= today) {
      total += source.amount;
      paidIds.add(source.id);
    }
  }

  return { total, paidIds };
}

function computeTodayEarned(sources, now = new Date()) {
  const workDays = workingDaysInMonth(now.getFullYear(), now.getMonth());
  return sources.reduce((sum, source) => sum + source.amount / workDays, 0);
}

function computeNext(sources, now = new Date()) {
  if (!sources.length) return null;

  const todayStart = startOfDay(now);
  const year = now.getFullYear();
  const month = now.getMonth();
  const today = now.getDate();

  const upcoming = sources
    .map((source) => {
      const paydayThis = effectivePayday(year, month, source.day);
      let payDate;
      if (paydayThis >= today) {
        payDate = new Date(year, month, paydayThis);
      } else {
        const nextMonth = month + 1;
        const nextYear = nextMonth > 11 ? year + 1 : year;
        const nextMonthIndex = nextMonth % 12;
        const paydayNext = effectivePayday(nextYear, nextMonthIndex, source.day);
        payDate = new Date(nextYear, nextMonthIndex, paydayNext);
      }
      const daysUntil = Math.round((startOfDay(payDate) - todayStart) / 86400000);
      return { source, payDate, daysUntil };
    })
    .sort((a, b) => a.daysUntil - b.daysUntil || a.source.day - b.source.day);

  return upcoming[0];
}

function setFormOpen(open, editing = null) {
  els.form.hidden = !open;
  els.toggleForm.textContent = open ? "Закрити" : "Додати";
  if (!open) {
    els.form.reset();
    els.id.value = "";
    els.save.textContent = "Зберегти";
    return;
  }
  if (editing) {
    els.id.value = editing.id;
    els.name.value = editing.name;
    els.amount.value = String(editing.amount);
    els.day.value = String(editing.day);
    els.save.textContent = "Оновити";
    els.name.focus();
  } else {
    els.id.value = "";
    els.save.textContent = "Зберегти";
    els.name.focus();
  }
}

function spawnDrop() {
  if (!els.drops) return;
  const drop = document.createElement("span");
  drop.className = "coin-drop";
  drop.style.left = `${18 + Math.random() * 64}%`;
  drop.style.animationDuration = `${0.85 + Math.random() * 0.45}s`;
  els.drops.appendChild(drop);
  drop.addEventListener("animationend", () => drop.remove());
}

function render() {
  const sources = loadSources().sort((a, b) => a.day - b.day || a.name.localeCompare(b.name, "uk"));
  const now = new Date();
  const { total, paidIds } = computeJar(sources, now);
  const next = computeNext(sources, now);
  const todayEarned = computeTodayEarned(sources, now);
  const workDays = workingDaysInMonth(now.getFullYear(), now.getMonth());
  const monthTotal = sources.reduce((sum, s) => sum + s.amount, 0);
  const fillPct = monthTotal > 0 ? Math.min(100, Math.round((total / monthTotal) * 100)) : 0;

  if (els.monthLine) {
    const name = MONTHS_UK[now.getMonth()];
    els.monthLine.textContent = `${name.charAt(0).toUpperCase()}${name.slice(1)} ${now.getFullYear()}`;
  }

  els.jarAmount.textContent = money(total);
  els.jarFill.style.height = `${fillPct}%`;
  els.jarAmount.classList.remove("bump");
  void els.jarAmount.offsetWidth;
  els.jarAmount.classList.add("bump");

  if (els.todayLine) {
    els.todayLine.textContent =
      sources.length === 0
        ? "За сьогодні: $0"
        : `За сьогодні: ${money(todayEarned)} · ${workDays} роб. дн.`;
  }

  if (!next) {
    els.nextLine.textContent = "Додайте джерело доходу";
  } else if (next.daysUntil === 0) {
    els.nextLine.innerHTML = `Сьогодні: <strong>${escapeHtml(next.source.name)}</strong> · ${money(next.source.amount)}`;
  } else {
    els.nextLine.innerHTML = `Наступна через <strong>${next.daysUntil} ${daysWord(next.daysUntil)}</strong> · ${escapeHtml(next.source.name)} · ${money(next.source.amount)}`;
  }

  els.emptyState.hidden = sources.length > 0;
  els.sourceList.innerHTML = sources
    .map((source) => {
      const paid = paidIds.has(source.id);
      const daily = source.amount / workDays;
      return `
        <li class="source-item${paid ? " paid" : ""}" data-id="${source.id}">
          <div class="source-name">${escapeHtml(source.name)}</div>
          <div class="source-amount">${money(source.amount)}</div>
          <div class="source-meta">${source.day} число${paid ? " · у кишені" : " · очікується"} · ${money(daily)}/день</div>
          <div class="source-actions">
            <button type="button" class="btn-icon edit" data-action="edit" aria-label="Редагувати ${escapeHtml(source.name)}">Редагувати</button>
            <button type="button" class="btn-icon delete" data-action="delete" aria-label="Видалити ${escapeHtml(source.name)}">Видалити</button>
          </div>
        </li>
      `;
    })
    .join("");
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

els.toggleForm.addEventListener("click", () => {
  setFormOpen(els.form.hidden);
});

els.cancelForm.addEventListener("click", () => {
  setFormOpen(false);
});

els.form.addEventListener("submit", (event) => {
  event.preventDefault();
  const name = els.name.value.trim();
  const amount = Number(els.amount.value);
  const day = clampDay(Number(els.day.value));
  if (!name || !Number.isFinite(amount) || amount < 0 || !Number.isFinite(day)) return;

  const sources = loadSources();
  const editingId = els.id.value;
  if (editingId) {
    const idx = sources.findIndex((s) => s.id === editingId);
    if (idx >= 0) {
      sources[idx] = { ...sources[idx], name, amount, day };
    }
  } else {
    sources.push({
      id: uuid(),
      name,
      amount,
      day,
    });
  }
  saveSources(sources);
  setFormOpen(false);
  render();
});

els.sourceList.addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  const item = button.closest(".source-item");
  if (!item) return;
  const id = item.dataset.id;
  const sources = loadSources();
  const source = sources.find((s) => s.id === id);
  if (!source) return;

  if (button.dataset.action === "edit") {
    setFormOpen(true, source);
    return;
  }

  if (button.dataset.action === "delete") {
    saveSources(sources.filter((s) => s.id !== id));
    if (els.id.value === id) setFormOpen(false);
    render();
  }
});

render();
setInterval(spawnDrop, 1000);
spawnDrop();

const installHint = document.getElementById("install-hint");

function setHint(text, ok = false) {
  if (!installHint) return;
  installHint.hidden = !text;
  installHint.textContent = text;
  installHint.classList.toggle("ok", ok);
}

setHint("Файл працює офлайн. Збережіть у Файли та «На екран Дому».", true);

</script>
